[project]
name = "interlock"
version = "0.1.0"
description = "Interlock server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
    "httpx>=0.27",
    "anthropic>=0.40",
    "reportlab>=4.0",
    "python-docx>=1.1",
    "matplotlib>=3.8",
]

[tool.vercel]
entrypoint = "backend.interlock.server:app"
